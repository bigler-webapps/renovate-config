# Repos that receive branch rulesets via apply-rulesets workflow.
#
# Each entry: full GitHub slug (owner/repo) and which rulesets to apply.
# Available rulesets are JSON files in this directory (without .json suffix).
#
# Apps: develop + main protected
# Platform: main only (no develop branch model in those repos)

repos:
  # --- Apps ---
