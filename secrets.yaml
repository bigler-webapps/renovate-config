config:
  target_repo: "MichaBigler/renovate-config"

secrets:
  # Fine-grained PAT used by apply-rulesets.yml to PUT/POST branch rulesets
  # against all repos listed in rulesets/repos.yml.
  #
  # Required token scopes (fine-grained PAT):
  #   - Repository access: every repo in rulesets/repos.yml
  #   - Repository permissions:
  #       - Administration: Read and write
  #       - Metadata: Read-only
  #
  # Proton entry expected at:
  #   "Projekt Webapp-Management/GitHub/rulesets_pat"
  RULESETS_TOKEN:
    source: "proton://Projekt Webapp-Management/GitHub/rulesets_pat"
    exclude_from_env: true
    dev_default: "ignore_me_locally"
